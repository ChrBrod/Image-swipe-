<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiles">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="tiles-manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Picture Tiles</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #key {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 24px;
    background: #ffb74d; touch-action: manipulation;
  }
  #key input, #key button {
    font-size: 22px; padding: 14px 16px; border: 0; border-radius: 14px;
    width: 100%; max-width: 360px; box-sizing: border-box;
  }
  #key input { -webkit-user-select: text; user-select: text; }
  #key button { background: #2e7d32; color: #fff; font-weight: 700; }
  #home {
    position: fixed; inset: 0; display: none; box-sizing: border-box;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 12px; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    background: #ffb74d;
  }
  @media (orientation: landscape) {
    #home { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; }
  }
  .tile {
    position: relative; border-radius: 24px; overflow: hidden;
    background: #fff3e0 center / cover no-repeat;
    box-shadow: 0 4px 0 rgba(0,0,0,.2);
    transition: transform 120ms;
  }
  .tile.press { transform: scale(.95); }
  .tile span {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 8px;
    background: rgba(0,0,0,.45); color: #fff; font-size: 26px; font-weight: 700;
    text-align: center; text-transform: capitalize;
  }
  #stage { position: fixed; inset: 0; display: none; }
  #stage img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; pointer-events: none; -webkit-user-drag: none;
    will-change: opacity; transition: opacity 250ms ease-out;
  }
  #msg {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 28px; text-align: center; padding: 24px;
  }
</style>
</head>
<body>

<div id="key">
  <input id="k" type="text" placeholder="Pixabay key (one time only)" autocapitalize="off" spellcheck="false">
  <button id="kb">Save</button>
</div>

<div id="home"></div>

<div id="stage"><div id="msg"></div></div>

<script>
(() => {
  const keyBox = document.getElementById('key');
  const home = document.getElementById('home');
  const stage = document.getElementById('stage');
  const msg = document.getElementById('msg');

  // Things a small child likes to look at. Four are picked at random each time.
  const WORDS = [
    'dog', 'cat', 'horse', 'cow', 'pig', 'sheep', 'duck', 'chicken', 'rabbit',
    'elephant', 'giraffe', 'lion', 'tiger', 'zebra', 'monkey', 'bear', 'penguin',
    'fish', 'butterfly', 'bird', 'owl', 'frog', 'turtle', 'dolphin', 'whale',
    'airplane', 'helicopter', 'train', 'tractor', 'fire truck', 'bus', 'car',
    'boat', 'bicycle', 'excavator', 'motorcycle', 'hot air balloon', 'rocket',
    'flower', 'tree', 'apple', 'banana', 'strawberry', 'ball', 'moon', 'rainbow'
  ];

  let KEY = '';
  try { KEY = localStorage.getItem('pixabayKey') || ''; } catch (e) {}

  const shuffle = a => {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // ---------- Pixabay (safe search on). Results cached per word. ----------
  const PER_PAGE = 200;
  const cache = {}; // word -> { hits: [{big, small}], pages, fetched: Set }
  async function fetchPage(word, page) {
    const u = 'https://pixabay.com/api/?key=' + KEY +
              '&image_type=photo&safesearch=true&per_page=' + PER_PAGE +
              '&q=' + encodeURIComponent(word) + '&page=' + page;
    const r = await fetch(u);
    if (r.status === 400 || r.status === 401) { forgetKey(); throw new Error('key'); }
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const c = cache[word] || (cache[word] = { hits: [], pages: 1, fetched: new Set() });
    c.pages = Math.max(1, Math.ceil((data.totalHits || 0) / PER_PAGE));
    c.fetched.add(page);
    const out = [];
    for (const it of data.hits || []) {
      const big = it.largeImageURL || it.webformatURL;
      if (big) out.push({ big, small: it.webformatURL || big });
    }
    c.hits.push(...out);
    return out;
  }
  async function firstHits(word) {
    if (!cache[word]) await fetchPage(word, 1);
    return cache[word].hits;
  }

  function forgetKey() {
    KEY = '';
    try { localStorage.removeItem('pixabayKey'); } catch (e) {}
  }

  // ---------- Home: 4 random tiles ----------
  function showHome() {
    stage.style.display = 'none';
    keyBox.style.display = 'none';
    if (!KEY) { keyBox.style.display = 'flex'; home.style.display = 'none'; return; }
    home.style.display = 'grid';
    home.innerHTML = '';
    for (const word of shuffle(WORDS.slice()).slice(0, 4)) {
      const t = document.createElement('div');
      t.className = 'tile';
      t.dataset.word = word;
      t.innerHTML = '<span></span>';
      t.firstChild.textContent = word;
      home.appendChild(t);
      firstHits(word).then(hits => {
        const h = hits[Math.floor(Math.random() * Math.min(hits.length, 20))];
        if (h) t.style.backgroundImage = 'url("' + h.small + '")';
      }).catch(() => { if (!KEY) showHome(); });
    }
  }

  document.getElementById('kb').addEventListener('click', () => {
    const v = document.getElementById('k').value.trim();
    if (!v) return;
    KEY = v;
    try { localStorage.setItem('pixabayKey', v); } catch (e) {}
    document.getElementById('k').value = '';
    document.getElementById('k').blur();
    showHome();
  });

  let pressed = null;
  home.addEventListener('pointerdown', e => {
    pressed = e.target.closest('.tile');
    if (pressed) pressed.classList.add('press');
  });
  home.addEventListener('pointerup', e => {
    const t = e.target.closest('.tile');
    if (pressed) pressed.classList.remove('press');
    if (t && t === pressed) start(t.dataset.word);
    pressed = null;
  });
  home.addEventListener('pointercancel', () => {
    if (pressed) pressed.classList.remove('press');
    pressed = null;
  });

  // ---------- Picture stream: random order, tap for the next one ----------
  let word = '', queue = [], current = null, busy = false, session = 0;

  // Refill the queue with every known picture in a new random order,
  // pulling in another random page of results when there are more.
  async function refill() {
    const c = cache[word];
    const left = [];
    for (let p = 1; p <= Math.min(c.pages, 3); p++) if (!c.fetched.has(p)) left.push(p);
    if (left.length) {
      try { await fetchPage(word, left[Math.floor(Math.random() * left.length)]); } catch (e) {}
    }
    const last = current && current.src;
    queue = shuffle(c.hits.slice()).filter(h => h.big !== last);
  }

  function loadImg(src) {
    return new Promise(res => {
      const img = new Image();
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';
      img.draggable = false;
      const t = setTimeout(() => res(null), 12000);
      img.onload = () => { clearTimeout(t); res(img.naturalWidth ? img : null); };
      img.onerror = () => { clearTimeout(t); res(null); };
      img.src = src;
    });
  }

  // Keep a couple of pictures loaded ahead so taps feel instant.
  const ready = [];
  let filling = false;
  async function fill() {
    if (filling) return;
    filling = true;
    const my = session;
    let fails = 0;
    while (ready.length < 3 && fails < 30 && my === session) {
      if (!queue.length) await refill();
      if (!queue.length || my !== session) break;
      const img = await loadImg(queue.shift().big);
      if (my !== session) break;
      if (img) { ready.push(img); fails = 0; } else fails++;
    }
    filling = false;
  }

  async function next() {
    if (busy) return;
    busy = true;
    const my = session;
    if (!ready.length) {
      await fill();
      if (my !== session) { busy = false; return; }
      if (!ready.length) {
        if (!current) msg.textContent = 'No pictures found';
        busy = false; return;
      }
    }
    const img = ready.shift();
    fill();
    img.style.opacity = '0';
    stage.appendChild(img);
    img.getBoundingClientRect();
    img.style.opacity = '1';
    const old = current;
    current = img;
    msg.textContent = '';
    setTimeout(() => { if (old) old.remove(); busy = false; }, 260);
  }

  async function start(w) {
    session++;
    word = w; queue = []; ready.length = 0; current = null; busy = false;
    stage.querySelectorAll('img').forEach(i => i.remove());
    home.style.display = 'none';
    stage.style.display = 'block';
    msg.textContent = '…';
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    try { await firstHits(w); } catch (e) {}
    if (!cache[w]) { msg.textContent = 'No pictures found'; return; }
    next();
  }

  function backHome() {
    session++;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    showHome();
  }

  // Tap or swipe = next picture. Hold top-left corner 3 s = back to tiles.
  let sx = 0, sy = 0, holdTimer = null, down = false;
  stage.addEventListener('pointerdown', e => {
    if (!e.isPrimary) return;
    sx = e.clientX; sy = e.clientY; down = true;
    if (e.clientX < 60 && e.clientY < 60) holdTimer = setTimeout(() => { holdTimer = null; down = false; backHome(); }, 3000);
  });
  stage.addEventListener('pointermove', e => {
    if (holdTimer && (Math.abs(e.clientX - sx) > 20 || Math.abs(e.clientY - sy) > 20)) {
      clearTimeout(holdTimer); holdTimer = null;
    }
  });
  stage.addEventListener('pointerup', e => {
    if (!e.isPrimary || !down) return;
    down = false;
    const inCorner = sx < 60 && sy < 60;
    clearTimeout(holdTimer); holdTimer = null;
    if (!inCorner) next();
  });
  stage.addEventListener('pointercancel', () => { down = false; clearTimeout(holdTimer); holdTimer = null; });

  // Block zoom, long-press menus, scrolling, and multi-touch gestures
  ['gesturestart', 'gesturechange', 'contextmenu', 'dragstart', 'selectstart']
    .forEach(t => document.addEventListener(t, e => e.preventDefault()));
  document.addEventListener('touchmove', e => {
    if (stage.style.display === 'block') e.preventDefault();
  }, { passive: false });
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    if (keyBox.style.display === 'flex') return;
    const now = Date.now();
    if (now - lastTouch < 350) e.preventDefault(); // no double-tap zoom
    lastTouch = now;
  }, { passive: false });

  // Trap the Android back button / back swipe
  history.pushState(null, '', location.href);
  addEventListener('popstate', () => { history.pushState(null, '', location.href); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  showHome();
})();
</script>
</body>
</html>
