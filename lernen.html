<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wo ist das?">
<meta name="theme-color" content="#4db6ac">
<link rel="manifest" href="lernen-manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Wo ist das?</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #4db6ac; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px;
    touch-action: manipulation; text-align: center; color: #fff;
  }
  #start h1 { margin: 0 0 8px; font-size: 40px; }
  #start input, #start button {
    font-size: 22px; padding: 14px 16px; border: 0; border-radius: 14px;
    width: 100%; max-width: 360px; box-sizing: border-box;
  }
  #start input { -webkit-user-select: text; user-select: text; }
  #go { background: #ff8a65; color: #fff; font-weight: 700; font-size: 30px !important; padding: 20px !important; }
  #note { font-size: 15px; max-width: 360px; opacity: .9; }
  #game {
    position: fixed; inset: 0; display: none; flex-direction: column; box-sizing: border-box;
    gap: 12px; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }
  #q {
    flex: 0 0 auto; text-align: center; color: #fff; font-size: 30px; font-weight: 700;
    min-height: 1.3em; text-shadow: 0 2px 0 rgba(0,0,0,.15);
  }
  #cards { flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  @media (orientation: landscape) { #cards { flex-direction: row; } }
  .card {
    flex: 1 1 0; min-height: 0; min-width: 0; position: relative;
    border-radius: 28px; overflow: hidden; background: #fff;
    border: 6px solid #fff; box-sizing: border-box;
    box-shadow: 0 5px 0 rgba(0,0,0,.18);
    opacity: 0; transform: scale(.92);
    transition: opacity 350ms ease-out, transform 350ms ease-out, border-color 250ms;
  }
  .card.in { opacity: 1; transform: scale(1); }
  .card img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    pointer-events: none; -webkit-user-drag: none;
  }
  .card.right { border-color: #66bb6a; transform: scale(1.04); box-shadow: 0 0 0 6px rgba(102,187,106,.5); }
  .card.fade { opacity: .25; transform: scale(.94); }
  .card.wrong { animation: shake 450ms ease-in-out; border-color: #ffb74d; }
  @keyframes shake {
    0%, 100% { translate: 0; } 20% { translate: -10px; } 40% { translate: 10px; }
    60% { translate: -6px; } 80% { translate: 6px; }
  }
  #msg {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #fff; font-size: 28px; text-align: center; padding: 24px; pointer-events: none;
  }
</style>
</head>
<body>

<div id="start">
  <h1>Wo ist das?</h1>
  <input id="k" type="text" placeholder="Pixabay key (one time only)" autocapitalize="off" spellcheck="false">
  <button id="go">Los geht's!</button>
  <div id="note"></div>
</div>

<div id="game">
  <div id="q"></div>
  <div id="cards"></div>
</div>

<div id="msg"></div>

<script>
(() => {
  const startBox = document.getElementById('start');
  const keyInput = document.getElementById('k');
  const note = document.getElementById('note');
  const game = document.getElementById('game');
  const qBox = document.getElementById('q');
  const cardsBox = document.getElementById('cards');
  const msg = document.getElementById('msg');

  // [article, German word, Pixabay search, group]. The wrong picture always
  // comes from a different group, so the two pictures never look alike.
  const WORDS = [
    ['der', 'Hund', 'dog', 'tier'], ['die', 'Katze', 'cat', 'tier'],
    ['das', 'Pferd', 'horse', 'tier'], ['die', 'Kuh', 'cow', 'tier'],
    ['das', 'Schwein', 'pig', 'tier'], ['das', 'Schaf', 'sheep', 'tier'],
    ['die', 'Ente', 'duck', 'tier'], ['das', 'Huhn', 'chicken hen', 'tier'],
    ['der', 'Hase', 'rabbit', 'tier'], ['der', 'Elefant', 'elephant', 'tier'],
    ['die', 'Giraffe', 'giraffe', 'tier'], ['der', 'Löwe', 'lion', 'tier'],
    ['der', 'Tiger', 'tiger', 'tier'], ['das', 'Zebra', 'zebra', 'tier'],
    ['der', 'Affe', 'monkey', 'tier'], ['der', 'Bär', 'bear', 'tier'],
    ['der', 'Pinguin', 'penguin', 'tier'], ['der', 'Fisch', 'fish', 'tier'],
    ['der', 'Schmetterling', 'butterfly', 'tier'], ['der', 'Vogel', 'bird', 'tier'],
    ['die', 'Eule', 'owl', 'tier'], ['der', 'Frosch', 'frog', 'tier'],
    ['die', 'Schildkröte', 'turtle', 'tier'], ['der', 'Delfin', 'dolphin', 'tier'],
    ['das', 'Flugzeug', 'airplane', 'fahrzeug'], ['der', 'Hubschrauber', 'helicopter', 'fahrzeug'],
    ['der', 'Zug', 'train', 'fahrzeug'], ['der', 'Traktor', 'tractor', 'fahrzeug'],
    ['das', 'Feuerwehrauto', 'fire truck', 'fahrzeug'], ['der', 'Bus', 'bus', 'fahrzeug'],
    ['das', 'Auto', 'car', 'fahrzeug'], ['das', 'Boot', 'boat', 'fahrzeug'],
    ['das', 'Fahrrad', 'bicycle', 'fahrzeug'], ['der', 'Bagger', 'excavator', 'fahrzeug'],
    ['das', 'Motorrad', 'motorcycle', 'fahrzeug'], ['die', 'Rakete', 'rocket launch', 'fahrzeug'],
    ['die', 'Blume', 'flower', 'natur'], ['der', 'Baum', 'tree', 'natur'],
    ['der', 'Mond', 'moon', 'natur'], ['der', 'Regenbogen', 'rainbow', 'natur'],
    ['der', 'Apfel', 'apple fruit', 'essen'], ['die', 'Banane', 'banana', 'essen'],
    ['die', 'Erdbeere', 'strawberry', 'essen'], ['der', 'Ball', 'ball toy', 'dinge'],
  ].map(([art, word, q, group]) => ({ art, word, q, group }));

  const PRAISE = ['Super!', 'Richtig!', 'Toll gemacht!', 'Ja, genau!', 'Prima!', 'Klasse!'];

  let KEY = '';
  try { KEY = localStorage.getItem('pixabayKey') || ''; } catch (e) {}

  const pick = a => a[Math.floor(Math.random() * a.length)];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const name = w => w.art + ' ' + w.word;

  // ---------- German voice ----------
  const synth = window.speechSynthesis;
  let voice = null;
  function chooseVoice() {
    if (!synth) return;
    const vs = synth.getVoices().filter(v => /^de([-_]|$)/i.test(v.lang));
    const score = v =>
      (/premium|enhanced|natural|neural/i.test(v.name) ? 4 : 0) +
      (/anna|petra|helena|katja|marlene|vicki|google/i.test(v.name) ? 2 : 0) +
      (/de[-_]DE/i.test(v.lang) ? 1 : 0);
    vs.sort((a, b) => score(b) - score(a));
    voice = vs[0] || null;
  }
  if (synth) {
    chooseVoice();
    synth.addEventListener && synth.addEventListener('voiceschanged', chooseVoice);
  }

  // Speak slowly and warmly. Resolves when done (with a safety timeout,
  // because some browsers never fire "end").
  function speak(text) {
    return new Promise(res => {
      if (!synth) return res();
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE';
      if (voice) u.voice = voice;
      u.rate = 0.85;
      u.pitch = 1.1;
      let done = false;
      const finish = () => { if (!done) { done = true; clearTimeout(t); res(); } };
      const t = setTimeout(finish, 1500 + text.length * 110);
      u.onend = finish;
      u.onerror = finish;
      synth.speak(u);
    });
  }
  function hush() { if (synth) synth.cancel(); }

  // ---------- Soft chime for a right answer ----------
  let actx = null;
  function chime() {
    if (!actx) return;
    const now = actx.currentTime;
    [[784, 0], [1047, 0.12], [1319, 0.24]].forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + d);
      g.gain.linearRampToValueAtTime(0.12, now + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + d + 0.6);
      o.connect(g).connect(actx.destination);
      o.start(now + d); o.stop(now + d + 0.65);
    });
  }

  // ---------- Pixabay (safe search on). Results cached per word. ----------
  const cache = {};   // search -> hits
  const used = {};    // search -> Set of shown picture URLs
  async function hitsFor(w) {
    if (cache[w.q]) return cache[w.q];
    const u = 'https://pixabay.com/api/?key=' + KEY +
              '&image_type=photo&safesearch=true&per_page=60&q=' + encodeURIComponent(w.q);
    const r = await fetch(u);
    if (r.status === 400 || r.status === 401) { forgetKey(); throw new Error('key'); }
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    // The top results match the word best, so only those are used.
    return (cache[w.q] = (data.hits || []).map(h => h.webformatURL).filter(Boolean).slice(0, 40));
  }

  function forgetKey() {
    KEY = '';
    try { localStorage.removeItem('pixabayKey'); } catch (e) {}
  }

  function loadImg(src) {
    return new Promise(res => {
      const img = new Image();
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';
      img.draggable = false;
      const t = setTimeout(() => res(null), 10000);
      img.onload = () => { clearTimeout(t); res(img.naturalWidth ? img : null); };
      img.onerror = () => { clearTimeout(t); res(null); };
      img.src = src;
    });
  }

  async function pictureOf(w) {
    const hits = await hitsFor(w);
    const seen = used[w.q] || (used[w.q] = new Set());
    let fresh = hits.filter(h => !seen.has(h));
    if (!fresh.length) { seen.clear(); fresh = hits.slice(); }
    for (let i = 0; i < 4 && fresh.length; i++) {
      const src = fresh.splice(Math.floor(Math.random() * fresh.length), 1)[0];
      seen.add(src);
      const img = await loadImg(src);
      if (img) return img;
    }
    return null;
  }

  // ---------- Rounds ----------
  const recent = [];
  async function makeRound() {
    for (let tries = 0; tries < 5; tries++) {
      const target = pick(WORDS.filter(w => !recent.includes(w)));
      const other = pick(WORDS.filter(w => w.group !== target.group));
      const [a, b] = await Promise.all([pictureOf(target), pictureOf(other)]);
      if (a && b) {
        recent.push(target);
        if (recent.length > 8) recent.shift();
        return { target, other, a, b };
      }
      if (!KEY) throw new Error('key');
    }
    throw new Error('no pictures');
  }

  let state = 'off';   // 'asking' = taps count, 'busy' = taps ignored
  let round = null, upcoming = null, session = 0, idleTimer = null, idleCount = 0;

  const question = () => 'Wo ist ' + name(round.target) + '?';

  function ask() {
    const my = session;
    qBox.textContent = question();
    speak(question());
    clearTimeout(idleTimer);
    // No tap for a while: gently ask again (twice at most).
    idleTimer = setTimeout(() => {
      if (my === session && state === 'asking' && idleCount < 2) { idleCount++; ask(); }
    }, 11000);
  }

  async function nextRound() {
    const my = session;
    state = 'busy';
    try {
      round = await (upcoming || makeRound());
    } catch (e) {
      upcoming = null;
      if (my !== session) return;
      if (!KEY) return showStart();
      msg.textContent = 'Keine Bilder gefunden. Internet an?';
      msg.style.display = 'flex';
      await wait(4000);
      msg.style.display = 'none';
      if (my === session) nextRound();
      return;
    }
    if (my !== session) return;
    upcoming = makeRound();   // get the next pair ready in the background
    upcoming.catch(() => {});

    cardsBox.innerHTML = '';
    const pair = Math.random() < 0.5 ? [[round.a, true], [round.b, false]] : [[round.b, false], [round.a, true]];
    for (const [img, isRight] of pair) {
      const c = document.createElement('div');
      c.className = 'card';
      c.dataset.right = isRight ? '1' : '';
      c.appendChild(img);
      cardsBox.appendChild(c);
    }
    qBox.textContent = '';
    cardsBox.getBoundingClientRect();
    cardsBox.querySelectorAll('.card').forEach(c => c.classList.add('in'));
    await wait(600);
    if (my !== session) return;
    idleCount = 0;
    state = 'asking';
    ask();
  }

  async function tapped(card) {
    if (state !== 'asking') return;
    const my = session;
    state = 'busy';
    clearTimeout(idleTimer);
    hush();
    if (card.dataset.right) {
      chime();
      card.classList.add('right');
      cardsBox.querySelectorAll('.card').forEach(c => { if (c !== card) c.classList.add('fade'); });
      const praise = pick(PRAISE);
      qBox.textContent = praise;
      await wait(350);
      await speak(praise + ' Das ist ' + name(round.target) + '.');
      if (my !== session) return;
      await wait(900);
      if (my !== session) return;
      cardsBox.querySelectorAll('.card').forEach(c => c.classList.remove('in', 'right', 'fade'));
      await wait(350);
      if (my === session) nextRound();
    } else {
      card.classList.remove('wrong');
      card.getBoundingClientRect();
      card.classList.add('wrong');
      qBox.textContent = "Probier's nochmal!";
      await speak("Probier's nochmal!");
      if (my !== session) return;
      card.classList.remove('wrong');
      await wait(300);
      if (my !== session) return;
      idleCount = 0;
      state = 'asking';
      ask();
    }
  }

  let pressed = null;
  cardsBox.addEventListener('pointerdown', e => { pressed = e.target.closest('.card'); });
  cardsBox.addEventListener('pointerup', e => {
    const c = e.target.closest('.card');
    if (c && c === pressed) tapped(c);
    pressed = null;
  });
  cardsBox.addEventListener('pointercancel', () => { pressed = null; });

  // ---------- Start / stop ----------
  function showStart() {
    session++;
    state = 'off';
    hush();
    clearTimeout(idleTimer);
    upcoming = null;
    game.style.display = 'none';
    msg.style.display = 'none';
    startBox.style.display = 'flex';
    keyInput.style.display = KEY ? 'none' : 'block';
    chooseVoice();
    note.textContent = synth && !voice
      ? 'Keine deutsche Stimme gefunden. Siehe README, wie man eine installiert.'
      : '';
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }

  document.getElementById('go').addEventListener('click', () => {
    if (!KEY) {
      const v = keyInput.value.trim();
      if (!v) return;
      KEY = v;
      try { localStorage.setItem('pixabayKey', v); } catch (e) {}
      keyInput.value = '';
      keyInput.blur();
    }
    // Sound has to be switched on by a tap (phones require it).
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      actx.resume();
    } catch (e) {}
    chooseVoice();
    speak('Hallo! Los geht\'s!');
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    session++;
    startBox.style.display = 'none';
    game.style.display = 'flex';
    cardsBox.innerHTML = '';
    qBox.textContent = '';
    setTimeout(nextRound, 1200);
  });

  // Hold the top-left corner for 3 seconds = back to the start screen.
  let holdTimer = null;
  game.addEventListener('pointerdown', e => {
    if (e.clientX < 60 && e.clientY < 60) holdTimer = setTimeout(showStart, 3000);
  });
  ['pointerup', 'pointercancel'].forEach(t =>
    game.addEventListener(t, () => { clearTimeout(holdTimer); holdTimer = null; }));

  // Stop talking when the app is hidden; ask again when it comes back.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hush();
    else if (state === 'asking') ask();
  });

  // Block zoom, long-press menus, scrolling, and multi-touch gestures
  ['gesturestart', 'gesturechange', 'contextmenu', 'dragstart', 'selectstart']
    .forEach(t => document.addEventListener(t, e => e.preventDefault()));
  document.addEventListener('touchmove', e => {
    if (game.style.display === 'flex') e.preventDefault();
  }, { passive: false });
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    if (startBox.style.display === 'flex') return;
    const now = Date.now();
    if (now - lastTouch < 350) e.preventDefault(); // no double-tap zoom
    lastTouch = now;
  }, { passive: false });

  // Trap the Android back button / back swipe
  history.pushState(null, '', location.href);
  addEventListener('popstate', () => { history.pushState(null, '', location.href); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  showStart();
})();
</script>
</body>
</html>
