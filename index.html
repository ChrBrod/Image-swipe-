<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swipe">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Image Swipe</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #setup {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
    background: #ffb74d; touch-action: manipulation;
  }
  #setup form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }
  #setup input {
    font-size: 24px; padding: 14px 16px; border: 0; border-radius: 14px;
    -webkit-user-select: text; user-select: text;
  }
  #setup button {
    font-size: 24px; padding: 14px; border: 0; border-radius: 14px;
    background: #2e7d32; color: #fff; font-weight: 700;
  }
  #setup p { margin: 0; color: #5d4037; text-align: center; font-size: 14px; }
  #stage { position: fixed; inset: 0; display: none; }
  #stage img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; pointer-events: none; -webkit-user-drag: none;
    will-change: transform;
  }
  #msg {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 28px; text-align: center; padding: 24px;
  }
</style>
</head>
<body>

<div id="setup">
  <form id="form" autocomplete="off">
    <input id="q" type="search" placeholder="e.g. airplane" enterkeyhint="go" required>
    <button type="submit">Start</button>
  </form>
  <p>To get back here: close and reopen the app,<br>or hold the top-left corner for 3 seconds.</p>
</div>

<div id="stage"><div id="msg"></div></div>

<script>
(() => {
  const setup = document.getElementById('setup');
  const stage = document.getElementById('stage');
  const msg = document.getElementById('msg');
  const qInput = document.getElementById('q');

  try { qInput.value = localStorage.getItem('lastQuery') || ''; } catch (e) {}

  let query = '', urls = [], nextPage = 1, pageCount = Infinity, index = 0;
  let current = null, loading = false, animating = false;
  const seen = new Set();

  // ---------- Image source (Openverse: free, no key, mature content filtered) ----------
  async function fetchPage() {
    if (loading || nextPage > pageCount) return;
    loading = true;
    try {
      const u = 'https://api.openverse.org/v1/images/?page_size=20&mature=false' +
                '&q=' + encodeURIComponent(query) + '&page=' + nextPage;
      const r = await fetch(u);
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      pageCount = data.page_count || 0;
      nextPage++;
      for (const it of data.results || []) {
        const src = it.url;
        if (src && !seen.has(src)) { seen.add(src); urls.push(src); }
      }
    } catch (e) {
      pageCount = nextPage - 1; // stop fetching; keep what we have
    }
    loading = false;
  }

  // Load an image; resolves with the element, or null if it fails.
  function loadImg(src) {
    return new Promise(res => {
      const img = new Image();
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';
      img.draggable = false;
      const t = setTimeout(() => res(null), 12000);
      img.onload = () => { clearTimeout(t); res(img.naturalWidth ? img : null); };
      img.onerror = () => { clearTimeout(t); res(null); };
      img.src = src;
    });
  }

  // Preloaded images waiting to be shown
  const ready = [];
  let filling = false;
  async function fill() {
    if (filling) return;
    filling = true;
    let fails = 0;
    while (ready.length < 3 && fails < 40) {
      if (index >= urls.length - 5) await fetchPage();
      if (index >= urls.length) {
        if (!urls.length) break;
        index = 0; // out of results: loop back to the start
      }
      const img = await loadImg(urls[index++]);
      if (img) { ready.push(img); fails = 0; } else fails++;
    }
    filling = false;
  }

  async function next() {
    if (animating) return;
    if (!ready.length) {
      if (!current) msg.textContent = '';
      await fill();
      if (!ready.length) { if (!current) msg.textContent = 'No pictures found'; return; }
    }
    const img = ready.shift();
    fill();
    animating = true;
    img.style.transform = 'translateX(100%)';
    stage.appendChild(img);
    img.getBoundingClientRect();
    const old = current;
    const dur = 'transform 280ms ease-out';
    img.style.transition = dur;
    img.style.transform = 'translateX(0)';
    if (old) { old.style.transition = dur; old.style.transform = 'translateX(-100%)'; }
    current = img;
    msg.textContent = '';
    setTimeout(() => { if (old) old.remove(); animating = false; }, 300);
  }

  // ---------- Start ----------
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    query = qInput.value.trim();
    if (!query) return;
    try { localStorage.setItem('lastQuery', query); } catch (err) {}
    qInput.blur();
    urls = []; nextPage = 1; pageCount = Infinity; index = 0; seen.clear();
    ready.length = 0;
    stage.querySelectorAll('img').forEach(i => i.remove());
    current = null;
    setup.style.display = 'none';
    stage.style.display = 'block';
    msg.textContent = '…';
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    next();
  });

  function backToSetup() {
    stage.style.display = 'none';
    setup.style.display = 'flex';
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }

  // ---------- Gestures: only a right-to-left swipe does anything ----------
  let sx = 0, sy = 0, st = 0, tracking = false, holdTimer = null;

  stage.addEventListener('pointerdown', e => {
    if (!e.isPrimary) return;
    sx = e.clientX; sy = e.clientY; st = Date.now(); tracking = true;
    // Hidden parent exit: hold the top-left corner for 3 seconds
    if (e.clientX < 60 && e.clientY < 60) holdTimer = setTimeout(backToSetup, 3000);
  });
  stage.addEventListener('pointermove', e => {
    if (holdTimer && (Math.abs(e.clientX - sx) > 20 || Math.abs(e.clientY - sy) > 20)) {
      clearTimeout(holdTimer); holdTimer = null;
    }
  });
  const end = e => {
    clearTimeout(holdTimer); holdTimer = null;
    if (!tracking || !e.isPrimary) return;
    tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (dx < -40 && Math.abs(dx) > Math.abs(dy) && Date.now() - st < 1500) next();
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', () => { tracking = false; clearTimeout(holdTimer); holdTimer = null; });

  // Block zoom, long-press menus, scrolling, and multi-touch gestures
  ['gesturestart', 'gesturechange', 'contextmenu', 'dragstart', 'selectstart']
    .forEach(t => document.addEventListener(t, e => e.preventDefault()));
  document.addEventListener('touchmove', e => {
    if (stage.style.display === 'block') e.preventDefault();
  }, { passive: false });
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    if (stage.style.display !== 'block') return;
    const now = Date.now();
    if (now - lastTouch < 350) e.preventDefault(); // no double-tap zoom
    lastTouch = now;
  }, { passive: false });

  // Trap the Android back button / back swipe while swiping
  history.pushState(null, '', location.href);
  addEventListener('popstate', () => { history.pushState(null, '', location.href); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
